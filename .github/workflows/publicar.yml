name: Publicar APK
on:
  push:
    paths: ['.github/workflows/publicar.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 'Link do APK no Expo'
        required: true
      versao:
        description: 'Versao (ex: v0.1.2)'
        required: true
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      URL: ${{ github.event.inputs.url || 'https://expo.dev/artifacts/eas/FK_2xEo1O-jdPBhHfrkXByM1MrC-CC8oIa4H0i7wI4A.apk' }}
      VERSAO: ${{ github.event.inputs.versao || 'v0.1.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL --retry 3 -o corre-maraka.apk "$URL"
          ls -l corre-maraka.apk
          unzip -tq corre-maraka.apk | tail -1
          gh release create "$VERSAO" corre-maraka.apk --title "Corre Maraka $VERSAO" --notes "App Corre Maraka para Android" --latest
